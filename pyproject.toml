[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-gpu-inference-study"
version = "0.1.0"
description = "Experimental GPT-2 CPU-GPU placement, frozen cost prediction, and reproducible evaluation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["hetero*", "offload_research*"]
exclude = ["tests*", "research_tests*", "data*", "docs*", "work*"]
